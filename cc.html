<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Spotify 音樂查詢</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    .container {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 260px;
    }
    .box {
      background: #1e293b;
      padding: 12px;
      border-radius: 6px;
      display: flex;
      gap: 6px;
    }
    input {
      flex: 1;
      padding: 6px;
      border-radius: 4px;
      border: none;
    }
    button {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      background: #22c55e;
      color: black;
      cursor: pointer;
    }
    .result {
      margin-top: 10px;
      background: #020617;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.6;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="box">
    <input id="artistInput" placeholder="查歌手">
    <button onclick="searchArtist()">查詢</button>
  </div>
  <div class="box">
    <input id="albumInput" placeholder="查專輯名稱">
    <button onclick="searchAlbum()">查詢</button>
  </div>
  <div class="box">
    <input id="trackInput" placeholder="查單曲名稱">
    <button onclick="searchTrack()">查詢</button>
  </div>

  <div class="result" id="result">查詢結果會顯示在這裡</div>
</div>
<script>
  // ⚠️ 請在這裡填入你自己的 Client ID (從 Spotify Developer Dashboard 取得)
  const CLIENT_ID = "281855304b7d42258c82864dacefd7d0";

  // ⚠️ 請在這裡填入你設定的 GitHub Pages 網址 (Redirect URI)
  const REDIRECT_URI = "https://shencx2010.github.io/cc.html"; // 例如: http://googleusercontent.com/username/spotify-project

  let token = '';

  /**
   * 檢查 URL 是否包含 Access Token，如果沒有則導向 Spotify 授權
   */
  function checkTokenAndAuthorize() {
    // 檢查網址的 hash (#) 部分，因為 Implicit Flow 會把 Token 放在這裡
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    
    // 如果網址中有 access_token 參數，就提取出來
    if (params.has('access_token')) {
      token = params.get('access_token');
      // 清除網址上的 Token 資訊，讓頁面看起來乾淨
      window.history.pushState('', document.title, window.location.pathname + window.location.search);
      document.getElementById("result").innerText = "✅ 授權成功！現在可以開始查詢音樂了。Token 效期約一小時。";
    } else {
      // 如果沒有 Token，就導向 Spotify 授權頁面
      document.getElementById("result").innerText = "⚠️ 正在取得 Spotify 授權，請稍候...";
      
      const scope = 'streaming user-read-email user-read-private'; // 請求的權限範圍
      
      // 建構授權網址
      const authUrl = 'https://api.spotify.com/v1/search`，並且查詢參數' +
        'response_type=token' +
        '&client_id=' + CLIENT_ID +
        (scope ? '&scope=' + encodeURIComponent(scope) : '') +
        '&redirect_uri=' + encodeURIComponent(REDIRECT_URI);
        
      // 跳轉到 Spotify 登入頁面
      window.location = authUrl;
    }
  }

  // 頁面載入時，執行檢查
  window.onload = checkTokenAndAuthorize;

  // --- 查詢函式 (與原本相同，但現在依賴全域 token 變數) ---

  async function searchArtist() {
    if (!token) {
        document.getElementById("result").innerText = "⚠️ 請先完成 Spotify 授權！";
        return;
    }
    const q = document.getElementById("artistInput").value;
    const url = `https://api.spotify.com/v1/search?q=${q}&type=artist&limit=5`;
    fetchData(url, "歌手搜尋結果");
  }

  async function searchAlbum() {
    if (!token) {
        document.getElementById("result").innerText = "⚠️ 請先完成 Spotify 授權！";
        return;
    }
    const q = document.getElementById("albumInput").value;
    const url = `https://api.spotify.com/v1/search?q=${q}&type=album&limit=5`;
    fetchData(url, "專輯搜尋結果");
  }

  async function searchTrack() {
    if (!token) {
        document.getElementById("result").innerText = "⚠️ 請先完成 Spotify 授權！";
        return;
    }
    const q = document.getElementById("trackInput").value;
    const url = `https://api.spotify.com/v1/search?q=${q}&type=track&limit=5`;
    fetchData(url, "單曲搜尋結果");
  }

  async function fetchData(url, title) {
    const res = await fetch(url, {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    // 處理 Token 過期 (401 Unauthorized)
    if (res.status === 401) {
      document.getElementById("result").innerHTML = "⚠️ Token 已過期，請<a href='javascript:location.reload()' style='color:yellow;'>重新整理頁面</a>以重新授權。";
      return;
    }
    
    if (!res.ok) {
      document.getElementById("result").innerText = `⚠️ 查詢失敗：${res.status} ${res.statusText}`;
      return;
    }

    const data = await res.json();
    let output = `◆ ${title}\n\n`;

    // 格式化輸出結果
    // ... (這部分與您原本的程式碼相同)

    if (data.artists) {
      data.artists.items.forEach(a => {
        output += `歌手：${a.name}\n人氣：${a.popularity}\n\n`;
      });
    }

    if (data.albums) {
      data.albums.items.forEach(a => {
        output += `專輯：${a.name}\n歌手：${a.artists[0].name}\n\n`;
      });
    }

    if (data.tracks) {
      data.tracks.items.forEach(t => {
        // 取得 Spotify URI (格式：spotify:track:歌曲ID)
        const spotifyUri = t.uri; 
        
        // 取得歌曲名稱和歌手，用於 Google 歌詞搜尋
        const trackName = t.name;
        const artistName = t.artists[0].name;
        const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(artistName + " " + trackName + " 歌詞")}`;

        output += `歌曲：${trackName}\n`;
        output += `歌手：${artistName}\n`;
        // 1. 播放連結：使用 Spotify URI 跳轉到 App
        output += `[<a href="${spotifyUri}" target="_blank" style="color:#22c55e;">立即播放 🎵</a>] `;
        // 2. 歌詞連結：使用 Google 搜尋歌詞
        output += `[<a href="${googleSearchUrl}" target="_blank" style="color:#22c55e;">查歌詞 📜</a>]\n\n`;
      });
    }

    // 將純文字替換成可以顯示 HTML 連結的 innerHTML
    document.getElementById("result").innerHTML = output; 
  }
</script>

</body>

</html>
